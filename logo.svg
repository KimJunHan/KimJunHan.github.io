<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A3E44"/>
      <stop offset="100%" stop-color="#152228"/>
    </linearGradient>
    <linearGradient id="sensorGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8BC34A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8BC34A" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background circle -->
  <circle cx="200" cy="200" r="195" fill="#0A0E10"/>
  <circle cx="200" cy="200" r="195" fill="none" stroke="#2A3A40" stroke-width="2"/>

  <!-- road -->
  <rect x="40" y="255" width="320" height="50" rx="6" fill="#1A2226"/>
  <line x1="80" y1="280" x2="130" y2="280" stroke="#3A4A4E" stroke-width="3.5" stroke-dasharray="10 8"/>
  <line x1="160" y1="280" x2="210" y2="280" stroke="#3A4A4E" stroke-width="3.5" stroke-dasharray="10 8"/>
  <line x1="240" y1="280" x2="290" y2="280" stroke="#3A4A4E" stroke-width="3.5" stroke-dasharray="10 8"/>

  <!-- sensor detection cone -->
  <path d="M200,185 L105,100 Q200,55 295,100 Z" fill="url(#sensorGlow)"/>
  <path d="M200,185 L105,100 Q200,55 295,100" fill="none" stroke="#8BC34A" stroke-width="2" opacity="0.7"/>
  <path d="M135,120 Q200,85 265,120" fill="none" stroke="#8BC34A" stroke-width="1" opacity="0.35" stroke-dasharray="4 4"/>

  <!-- car body -->
  <rect x="140" y="185" width="120" height="78" rx="22" fill="url(#bodyGrad)" stroke="#4A6A72" stroke-width="2.5"/>
  <rect x="155" y="194" width="90" height="22" rx="8" fill="#1A2A30" stroke="#3A5258" stroke-width="1.5"/>
  <rect x="160" y="242" width="80" height="12" rx="5" fill="#1A2A30" stroke="#3A5258" stroke-width="1.5"/>
  <!-- wheels -->
  <rect x="136" y="200" width="8" height="16" rx="3" fill="#2A3E44" stroke="#4A6A72" stroke-width="1"/>
  <rect x="136" y="236" width="8" height="16" rx="3" fill="#2A3E44" stroke="#4A6A72" stroke-width="1"/>
  <rect x="256" y="200" width="8" height="16" rx="3" fill="#2A3E44" stroke="#4A6A72" stroke-width="1"/>
  <rect x="256" y="236" width="8" height="16" rx="3" fill="#2A3E44" stroke="#4A6A72" stroke-width="1"/>

  <!-- left eye -->
  <g filter="url(#glow)">
    <circle cx="172" cy="168" r="22" fill="#111D22" stroke="#8BC34A" stroke-width="3"/>
    <circle cx="172" cy="168" r="11" fill="#0A1215" stroke="#8BC34A" stroke-width="2"/>
    <circle cx="172" cy="168" r="5.5" fill="#8BC34A"/>
    <circle cx="169" cy="165" r="2.5" fill="#C5E1A5"/>
  </g>

  <!-- right eye -->
  <g filter="url(#glow)">
    <circle cx="228" cy="168" r="22" fill="#111D22" stroke="#8BC34A" stroke-width="3"/>
    <circle cx="228" cy="168" r="11" fill="#0A1215" stroke="#8BC34A" stroke-width="2"/>
    <circle cx="228" cy="168" r="5.5" fill="#8BC34A"/>
    <circle cx="225" cy="165" r="2.5" fill="#C5E1A5"/>
  </g>

  <!-- radar dots -->
  <circle cx="110" cy="205" r="3.5" fill="#EF5350" opacity="0.8"/>
  <circle cx="125" cy="150" r="3" fill="#EF5350" opacity="0.7"/>
  <circle cx="280" cy="195" r="3.5" fill="#EF5350" opacity="0.8"/>
  <circle cx="290" cy="235" r="3" fill="#EF5350" opacity="0.6"/>
  <circle cx="142" cy="130" r="2.5" fill="#EF5350" opacity="0.6"/>
  <circle cx="258" cy="133" r="2.5" fill="#EF5350" opacity="0.65"/>

  <!-- text -->
  <text x="200" y="340" text-anchor="middle" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-weight="800" font-size="28" fill="#F0F4F0" letter-spacing="0.02em">자율주행 연구일지</text>
  <text x="200" y="365" text-anchor="middle" font-family="sans-serif" font-weight="400" font-size="12" fill="#78908C" letter-spacing="0.1em">AUTONOMOUS DRIVING LAB NOTES</text>
</svg>
