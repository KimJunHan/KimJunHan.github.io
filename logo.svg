<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A5560"/>
      <stop offset="100%" stop-color="#1E3038"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#76FF03" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#76FF03" stop-opacity="0"/>
    </linearGradient>
    <filter id="eyeGlow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- bg -->
  <circle cx="200" cy="200" r="198" fill="#080C0E"/>
  <circle cx="200" cy="200" r="196" fill="none" stroke="#2E4448" stroke-width="3"/>

  <!-- road -->
  <rect x="50" y="220" width="300" height="42" rx="4" fill="#162020"/>
  <line x1="90" y1="241" x2="135" y2="241" stroke="#3E5555" stroke-width="4" stroke-dasharray="10 8"/>
  <line x1="165" y1="241" x2="210" y2="241" stroke="#3E5555" stroke-width="4" stroke-dasharray="10 8"/>
  <line x1="240" y1="241" x2="285" y2="241" stroke="#3E5555" stroke-width="4" stroke-dasharray="10 8"/>

  <!-- sensor cone -->
  <path d="M200,155 L115,80 Q200,42 285,80 Z" fill="url(#cone)"/>
  <path d="M200,155 L115,80 Q200,42 285,80" fill="none" stroke="#76FF03" stroke-width="2.5" opacity="0.8"/>
  <path d="M145,100 Q200,72 255,100" fill="none" stroke="#76FF03" stroke-width="1.5" opacity="0.4" stroke-dasharray="5 4"/>

  <!-- car body -->
  <rect x="148" y="155" width="104" height="70" rx="18" fill="url(#bodyGrad)" stroke="#5A8A96" stroke-width="3"/>
  <rect x="161" y="163" width="78" height="20" rx="7" fill="#1A2E34" stroke="#4A7680" stroke-width="2"/>
  <rect x="165" y="205" width="70" height="12" rx="5" fill="#1A2E34" stroke="#4A7680" stroke-width="2"/>
  <!-- wheels -->
  <rect x="143" y="170" width="9" height="16" rx="3.5" fill="#2E4A52" stroke="#5A8A96" stroke-width="1.5"/>
  <rect x="143" y="200" width="9" height="16" rx="3.5" fill="#2E4A52" stroke="#5A8A96" stroke-width="1.5"/>
  <rect x="248" y="170" width="9" height="16" rx="3.5" fill="#2E4A52" stroke="#5A8A96" stroke-width="1.5"/>
  <rect x="248" y="200" width="9" height="16" rx="3.5" fill="#2E4A52" stroke="#5A8A96" stroke-width="1.5"/>

  <!-- left eye -->
  <g filter="url(#eyeGlow)">
    <circle cx="178" cy="140" r="20" fill="#0E1A1E" stroke="#76FF03" stroke-width="3.5"/>
    <circle cx="178" cy="140" r="10" fill="#080E10" stroke="#76FF03" stroke-width="2.5"/>
    <circle cx="178" cy="140" r="5" fill="#76FF03"/>
    <circle cx="175" cy="137" r="2.2" fill="#CCFF90"/>
  </g>

  <!-- right eye -->
  <g filter="url(#eyeGlow)">
    <circle cx="222" cy="140" r="20" fill="#0E1A1E" stroke="#76FF03" stroke-width="3.5"/>
    <circle cx="222" cy="140" r="10" fill="#080E10" stroke="#76FF03" stroke-width="2.5"/>
    <circle cx="222" cy="140" r="5" fill="#76FF03"/>
    <circle cx="219" cy="137" r="2.2" fill="#CCFF90"/>
  </g>

  <!-- radar dots -->
  <circle cx="118" cy="175" r="4" fill="#FF1744" opacity="0.9"/>
  <circle cx="130" cy="125" r="3.5" fill="#FF1744" opacity="0.8"/>
  <circle cx="275" cy="168" r="4" fill="#FF1744" opacity="0.9"/>
  <circle cx="282" cy="205" r="3.5" fill="#FF1744" opacity="0.7"/>
  <circle cx="148" cy="105" r="3" fill="#FF1744" opacity="0.7"/>
  <circle cx="252" cy="108" r="3" fill="#FF1744" opacity="0.75"/>

  <!-- text inside circle -->
  <text x="200" y="296" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-weight="900" font-size="30" fill="#FFFFFF" letter-spacing="0.01em">자율주행 연구일지</text>
  <text x="200" y="322" text-anchor="middle" font-family="sans-serif" font-weight="500" font-size="11.5" fill="#90A4AE" letter-spacing="0.12em">AUTONOMOUS DRIVING</text>
  <text x="200" y="340" text-anchor="middle" font-family="sans-serif" font-weight="500" font-size="11.5" fill="#90A4AE" letter-spacing="0.12em">LAB NOTES</text>
</svg>
