<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5CCEC5"/>
      <stop offset="100%" stop-color="#1A8A80"/>
    </linearGradient>
    <linearGradient id="bodyShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#76FF03" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#76FF03" stop-opacity="0"/>
    </linearGradient>
    <filter id="eyeGlow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- bg -->
  <circle cx="200" cy="200" r="198" fill="#080C0E"/>
  <circle cx="200" cy="200" r="196" fill="none" stroke="#2E4448" stroke-width="3"/>

  <!-- road -->
  <rect x="50" y="222" width="300" height="40" rx="4" fill="#141E1E"/>
  <line x1="90" y1="242" x2="135" y2="242" stroke="#3E5555" stroke-width="4" stroke-dasharray="10 8"/>
  <line x1="165" y1="242" x2="210" y2="242" stroke="#3E5555" stroke-width="4" stroke-dasharray="10 8"/>
  <line x1="240" y1="242" x2="285" y2="242" stroke="#3E5555" stroke-width="4" stroke-dasharray="10 8"/>

  <!-- sensor cone -->
  <path d="M200,148 L115,75 Q200,35 285,75 Z" fill="url(#cone)"/>
  <path d="M200,148 L115,75 Q200,35 285,75" fill="none" stroke="#76FF03" stroke-width="2.5" opacity="0.8"/>
  <path d="M148,96 Q200,66 252,96" fill="none" stroke="#76FF03" stroke-width="1.5" opacity="0.4" stroke-dasharray="5 4"/>

  <!-- tesla-style car body (top-down, streamlined) -->
  <path d="
    M200,148
    Q212,148 220,152 L230,156 Q245,162 248,172
    L250,185 Q252,200 250,210
    L248,218 Q245,225 235,228 L220,230 Q212,232 200,232
    Q188,232 180,230 L165,228 Q155,225 152,218
    L150,210 Q148,200 150,185
    L152,172 Q155,162 170,156 L180,152 Q188,148 200,148 Z
  " fill="url(#bodyGrad)" stroke="#80E8DD" stroke-width="2.5"/>
  <!-- body shine -->
  <path d="
    M200,148
    Q212,148 220,152 L230,156 Q245,162 248,172
    L250,185 Q252,200 250,210
    L248,218 Q245,225 235,228 L220,230 Q212,232 200,232
    Q188,232 180,230 L165,228 Q155,225 152,218
    L150,210 Q148,200 150,185
    L152,172 Q155,162 170,156 L180,152 Q188,148 200,148 Z
  " fill="url(#bodyShine)"/>

  <!-- panoramic glass roof -->
  <path d="M185,158 Q200,155 215,158 L222,164 Q226,168 225,175 L222,180 Q200,183 178,180 L175,175 Q174,168 178,164 Z" fill="#0E2828" stroke="#4DB6AC" stroke-width="1.8"/>
  <!-- rear window -->
  <path d="M182,212 Q200,210 218,212 L220,218 Q218,222 200,223 Q182,222 180,218 Z" fill="#0E2828" stroke="#4DB6AC" stroke-width="1.8"/>

  <!-- center ridge line -->
  <line x1="200" y1="180" x2="200" y2="212" stroke="#4DB6AC" stroke-width="0.8" opacity="0.5"/>

  <!-- wheels -->
  <ellipse cx="155" cy="175" rx="5" ry="9" fill="#1A3838" stroke="#80E8DD" stroke-width="1.8"/>
  <ellipse cx="155" cy="210" rx="5" ry="9" fill="#1A3838" stroke="#80E8DD" stroke-width="1.8"/>
  <ellipse cx="245" cy="175" rx="5" ry="9" fill="#1A3838" stroke="#80E8DD" stroke-width="1.8"/>
  <ellipse cx="245" cy="210" rx="5" ry="9" fill="#1A3838" stroke="#80E8DD" stroke-width="1.8"/>

  <!-- left eye -->
  <g filter="url(#eyeGlow)">
    <circle cx="180" cy="135" r="18" fill="#0E1A1E" stroke="#76FF03" stroke-width="3.5"/>
    <circle cx="180" cy="135" r="9" fill="#080E10" stroke="#76FF03" stroke-width="2.5"/>
    <circle cx="180" cy="135" r="4.5" fill="#76FF03"/>
    <circle cx="177.5" cy="132.5" r="2" fill="#CCFF90"/>
  </g>

  <!-- right eye -->
  <g filter="url(#eyeGlow)">
    <circle cx="220" cy="135" r="18" fill="#0E1A1E" stroke="#76FF03" stroke-width="3.5"/>
    <circle cx="220" cy="135" r="9" fill="#080E10" stroke="#76FF03" stroke-width="2.5"/>
    <circle cx="220" cy="135" r="4.5" fill="#76FF03"/>
    <circle cx="217.5" cy="132.5" r="2" fill="#CCFF90"/>
  </g>

  <!-- radar dots -->
  <circle cx="120" cy="172" r="4" fill="#FF1744" opacity="0.9"/>
  <circle cx="132" cy="120" r="3.5" fill="#FF1744" opacity="0.8"/>
  <circle cx="273" cy="165" r="4" fill="#FF1744" opacity="0.9"/>
  <circle cx="280" cy="205" r="3.5" fill="#FF1744" opacity="0.7"/>
  <circle cx="150" cy="100" r="3" fill="#FF1744" opacity="0.7"/>
  <circle cx="250" cy="103" r="3" fill="#FF1744" opacity="0.75"/>

  <!-- text inside circle -->
  <text x="200" y="296" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-weight="900" font-size="30" fill="#FFFFFF" letter-spacing="0.01em">자율주행 연구일지</text>
  <text x="200" y="322" text-anchor="middle" font-family="sans-serif" font-weight="500" font-size="11.5" fill="#90A4AE" letter-spacing="0.12em">AUTONOMOUS DRIVING</text>
  <text x="200" y="340" text-anchor="middle" font-family="sans-serif" font-weight="500" font-size="11.5" fill="#90A4AE" letter-spacing="0.12em">LAB NOTES</text>
</svg>
