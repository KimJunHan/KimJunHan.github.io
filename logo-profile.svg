<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2A2E"/>
      <stop offset="100%" stop-color="#0A0E10"/>
    </linearGradient>
    <linearGradient id="sensorGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6F9D5C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6F9D5C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="400" height="400" rx="40" fill="#0A0E10"/>
  <rect width="400" height="400" rx="40" fill="none" stroke="#222D31" stroke-width="1.5"/>

  <!-- road -->
  <rect x="40" y="265" width="320" height="45" rx="4" fill="#141C1F"/>
  <line x1="80" y1="288" x2="120" y2="288" stroke="#333" stroke-width="2.5" stroke-dasharray="8 6"/>
  <line x1="145" y1="288" x2="185" y2="288" stroke="#333" stroke-width="2.5" stroke-dasharray="8 6"/>
  <line x1="210" y1="288" x2="250" y2="288" stroke="#333" stroke-width="2.5" stroke-dasharray="8 6"/>
  <line x1="275" y1="288" x2="315" y2="288" stroke="#333" stroke-width="2.5" stroke-dasharray="8 6"/>

  <!-- sensor detection cone -->
  <path d="M200,195 L105,115 Q200,78 295,115 Z" fill="url(#sensorGlow)" opacity="0.7"/>
  <path d="M200,195 L105,115 Q200,78 295,115" fill="none" stroke="#6F9D5C" stroke-width="1.2" opacity="0.5"/>

  <!-- car body -->
  <rect x="145" y="195" width="110" height="75" rx="20" fill="url(#bodyGrad)" stroke="#3A4A50" stroke-width="2"/>
  <!-- windshield -->
  <rect x="158" y="202" width="84" height="22" rx="7" fill="#1A2326" stroke="#2A3A40" stroke-width="1"/>
  <!-- rear window -->
  <rect x="163" y="250" width="74" height="12" rx="5" fill="#1A2326" stroke="#2A3A40" stroke-width="1"/>

  <!-- left eye -->
  <circle cx="175" cy="178" r="18" fill="#111719" stroke="#6F9D5C" stroke-width="2.5"/>
  <circle cx="175" cy="178" r="9" fill="#0A0E10" stroke="#6F9D5C" stroke-width="1.5"/>
  <circle cx="175" cy="178" r="4.5" fill="#6F9D5C"/>
  <circle cx="172" cy="175" r="2" fill="#A0D490"/>

  <!-- right eye -->
  <circle cx="225" cy="178" r="18" fill="#111719" stroke="#6F9D5C" stroke-width="2.5"/>
  <circle cx="225" cy="178" r="9" fill="#0A0E10" stroke="#6F9D5C" stroke-width="1.5"/>
  <circle cx="225" cy="178" r="4.5" fill="#6F9D5C"/>
  <circle cx="222" cy="175" r="2" fill="#A0D490"/>

  <!-- radar dots -->
  <circle cx="115" cy="210" r="2.5" fill="#CF5F6B" opacity="0.6"/>
  <circle cx="135" cy="160" r="2" fill="#CF5F6B" opacity="0.5"/>
  <circle cx="275" cy="200" r="2.5" fill="#CF5F6B" opacity="0.6"/>
  <circle cx="285" cy="235" r="2" fill="#CF5F6B" opacity="0.4"/>
  <circle cx="148" cy="140" r="2" fill="#CF5F6B" opacity="0.45"/>
  <circle cx="252" cy="145" r="2" fill="#CF5F6B" opacity="0.5"/>

  <!-- channel name -->
  <text x="200" y="350" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="30" fill="#EDF1F1">자율주행 연구일지</text>
</svg>
