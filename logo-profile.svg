<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A5560"/>
      <stop offset="100%" stop-color="#1E3038"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#76FF03" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#76FF03" stop-opacity="0"/>
    </linearGradient>
    <filter id="eyeGlow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- bg -->
  <rect width="400" height="400" rx="40" fill="#080C0E"/>
  <rect width="400" height="400" rx="40" fill="none" stroke="#2E4448" stroke-width="3"/>

  <!-- road -->
  <rect x="30" y="225" width="340" height="42" rx="4" fill="#162020"/>
  <line x1="70" y1="246" x2="120" y2="246" stroke="#3E5555" stroke-width="4" stroke-dasharray="10 8"/>
  <line x1="150" y1="246" x2="200" y2="246" stroke="#3E5555" stroke-width="4" stroke-dasharray="10 8"/>
  <line x1="230" y1="246" x2="280" y2="246" stroke="#3E5555" stroke-width="4" stroke-dasharray="10 8"/>
  <line x1="310" y1="246" x2="350" y2="246" stroke="#3E5555" stroke-width="4" stroke-dasharray="10 8"/>

  <!-- sensor cone -->
  <path d="M200,158 L105,75 Q200,32 295,75 Z" fill="url(#cone)"/>
  <path d="M200,158 L105,75 Q200,32 295,75" fill="none" stroke="#76FF03" stroke-width="2.5" opacity="0.8"/>
  <path d="M140,97 Q200,66 260,97" fill="none" stroke="#76FF03" stroke-width="1.5" opacity="0.4" stroke-dasharray="5 4"/>

  <!-- car body -->
  <rect x="145" y="158" width="110" height="72" rx="20" fill="url(#bodyGrad)" stroke="#5A8A96" stroke-width="3"/>
  <rect x="159" y="166" width="82" height="20" rx="7" fill="#1A2E34" stroke="#4A7680" stroke-width="2"/>
  <rect x="163" y="210" width="74" height="12" rx="5" fill="#1A2E34" stroke="#4A7680" stroke-width="2"/>
  <!-- wheels -->
  <rect x="140" y="174" width="9" height="16" rx="3.5" fill="#2E4A52" stroke="#5A8A96" stroke-width="1.5"/>
  <rect x="140" y="204" width="9" height="16" rx="3.5" fill="#2E4A52" stroke="#5A8A96" stroke-width="1.5"/>
  <rect x="251" y="174" width="9" height="16" rx="3.5" fill="#2E4A52" stroke="#5A8A96" stroke-width="1.5"/>
  <rect x="251" y="204" width="9" height="16" rx="3.5" fill="#2E4A52" stroke="#5A8A96" stroke-width="1.5"/>

  <!-- left eye -->
  <g filter="url(#eyeGlow)">
    <circle cx="176" cy="142" r="21" fill="#0E1A1E" stroke="#76FF03" stroke-width="3.5"/>
    <circle cx="176" cy="142" r="10.5" fill="#080E10" stroke="#76FF03" stroke-width="2.5"/>
    <circle cx="176" cy="142" r="5.2" fill="#76FF03"/>
    <circle cx="173" cy="139" r="2.2" fill="#CCFF90"/>
  </g>

  <!-- right eye -->
  <g filter="url(#eyeGlow)">
    <circle cx="224" cy="142" r="21" fill="#0E1A1E" stroke="#76FF03" stroke-width="3.5"/>
    <circle cx="224" cy="142" r="10.5" fill="#080E10" stroke="#76FF03" stroke-width="2.5"/>
    <circle cx="224" cy="142" r="5.2" fill="#76FF03"/>
    <circle cx="221" cy="139" r="2.2" fill="#CCFF90"/>
  </g>

  <!-- radar dots -->
  <circle cx="112" cy="180" r="4" fill="#FF1744" opacity="0.9"/>
  <circle cx="128" cy="125" r="3.5" fill="#FF1744" opacity="0.8"/>
  <circle cx="280" cy="172" r="4" fill="#FF1744" opacity="0.9"/>
  <circle cx="288" cy="210" r="3.5" fill="#FF1744" opacity="0.7"/>
  <circle cx="145" cy="105" r="3" fill="#FF1744" opacity="0.7"/>
  <circle cx="255" cy="108" r="3" fill="#FF1744" opacity="0.75"/>

  <!-- text -->
  <text x="200" y="306" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-weight="900" font-size="32" fill="#FFFFFF" letter-spacing="0.01em">자율주행 연구일지</text>
  <text x="200" y="336" text-anchor="middle" font-family="sans-serif" font-weight="500" font-size="12" fill="#90A4AE" letter-spacing="0.12em">AUTONOMOUS DRIVING</text>
  <text x="200" y="356" text-anchor="middle" font-family="sans-serif" font-weight="500" font-size="12" fill="#90A4AE" letter-spacing="0.12em">LAB NOTES</text>
</svg>
